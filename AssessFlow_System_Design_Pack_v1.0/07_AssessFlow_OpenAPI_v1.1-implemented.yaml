openapi: 3.1.0
info:
  title: AssessFlow API (implemented contract)
  version: 1.1.0
  description: >
    Implemented REST contract for the AssessFlow workflow
    (request → eligibility → plan → evidence → scorecard → result →
    recommendation → approval → development/reassessment → closure),
    plus Auth, Access/Administration, Roles Matrix, Calibration, AI Copilot,
    and Attachment scanning/streaming. All mutating commands use optimistic
    concurrency (expectedVersion, 409 on stale version) and Idempotency-Key.
servers:
- url: /api/v1/assessflow
security:
- bearerAuth: []
tags:
- name: System
- name: Auth
- name: Access
- name: Administration
- name: Cases
- name: Eligibility
- name: Planning
- name: Scorecard
- name: Events
- name: Evidence
- name: Attachments
- name: Results
- name: Recommendations
- name: Approvals
- name: Development
- name: Reassessment
- name: Calibration
- name: Copilot
paths:
  /health:
    get:
      tags: [System]
      summary: Service liveness check
      security: []
      responses:
        '200': { description: Service alive }
  /health/ready:
    get:
      tags: [System]
      summary: Service and database readiness check
      security: []
      responses:
        '200': { description: Service and database ready }
        '503': { description: Database unavailable }
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with company email and password
      security: []
      responses:
        '200': { description: Authenticated session and bearer token }
        '401': { description: Invalid credentials }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change current user password (temporary or voluntary)
      responses:
        '200': { description: Password updated and fresh token returned }
  /access/accounts:
    get:
      tags: [Access]
      summary: List access accounts
      responses:
        '200': { description: Access accounts list }
    post:
      tags: [Access]
      summary: Create access account
      responses:
        '201': { description: Account created }
  /access/accounts/assessor-options:
    get:
      tags: [Access]
      summary: List active accounts eligible to serve as assessors
      responses:
        '200': { description: Assessor options }
  /access/accounts/{id}:
    patch:
      tags: [Access]
      summary: Update access account role or data scope
      responses:
        '200': { description: Account updated }
    delete:
      tags: [Access]
      summary: Remove access account
      responses:
        '200': { description: Account deleted }
  /admin/accounts:
    get:
      tags: [Administration]
      summary: List administration managed accounts
      responses:
        '200': { description: Admin account list }
    post:
      tags: [Administration]
      summary: Create managed account with one-time password
      responses:
        '201': { description: Account created }
  /admin/accounts/{id}:
    patch:
      tags: [Administration]
      summary: Update account role, scope, or status
      responses:
        '200': { description: Account updated }
  /admin/accounts/{id}/deactivate:
    post:
      tags: [Administration]
      summary: Deactivate account
      responses:
        '200': { description: Account deactivated }
  /admin/accounts/{id}/reactivate:
    post:
      tags: [Administration]
      summary: Reactivate deactivated account with fresh one-time password
      responses:
        '200': { description: Account reactivated }
  /admin/accounts/{id}/reset-password:
    post:
      tags: [Administration]
      summary: Reset account password and require change at next sign-in
      responses:
        '200': { description: Password reset }
  /admin/roles-matrix:
    get:
      tags: [Administration]
      summary: Get live RBAC role permissions matrix derived from guard rules
      responses:
        '200': { description: Role permissions matrix }
  /admin/policy:
    get:
      tags: [Administration]
      summary: Get governance policy settings
      responses:
        '200': { description: Governance policy }
  /admin/policy/enforce:
    post:
      tags: [Administration]
      summary: Enforce or update governance policy settings
      responses:
        '200': { description: Governance policy updated }
  /admin/audit:
    get:
      tags: [Administration]
      summary: Search organization audit trail events
      responses:
        '200': { description: Paginated audit trail events and available actions }
  /overview:
    get:
      tags: [System]
      summary: Role-aware overview metrics, nav counts, tasks, and pipeline
      responses:
        '200': { description: Overview payload }
  /tasks:
    get:
      tags: [System]
      summary: Current user task queue (server-scoped)
      responses:
        '200': { description: Task list }
  /development-plans:
    get:
      tags: [Development]
      summary: Batch-list active development plans across scoped cases
      responses:
        '200': { description: Development plan list with case metadata }
  /assessor/assignments:
    get:
      tags: [Events]
      summary: List events assigned to the current assessor
      responses:
        '200': { description: Assessor event assignments }
  /me/results:
    get:
      tags: [Results]
      summary: List released assessment results for the signed-in employee
      responses:
        '200': { description: Released employee results }
  /cases:
    get:
      tags: [Cases]
      summary: List assessment cases
      parameters:
      - in: query
        name: status
        schema: { type: string }
      - in: query
        name: search
        schema: { type: string }
      responses:
        '200': { description: Case summaries }
    post:
      tags: [Cases]
      summary: Create a draft assessment case
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCaseRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentCase' }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /cases/{caseId}:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    get:
      tags: [Cases]
      summary: Get assessment case detail (includes availableActions)
      responses:
        '200': { description: Case detail }
        '404': { $ref: '#/components/responses/NotFound' }
  /cases/{caseId}/stages/reopen:
    post:
      tags: [Cases]
      summary: Reopen a completed workflow stage back to active editing
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Stage reopened }
        '409': { $ref: '#/components/responses/Conflict' }
  /cases/{caseId}/request:
    patch:
      tags: [Cases]
      summary: Admin edit of case intake request metadata
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Case request updated }
  /cases/{caseId}/employee-name:
    patch:
      tags: [Cases]
      summary: Update candidate employee display name on a case
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Employee name updated }
  /cases/{caseId}/submit:
    post:
      tags: [Cases]
      summary: Submit draft for eligibility review
      parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionCommand' }
      responses:
        '200': { description: Submitted (PENDING_ELIGIBILITY) }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /cases/{caseId}/eligibility/decision:
    post:
      tags: [Eligibility]
      summary: Record eligibility decision (ELIGIBLE moves to READY_FOR_PLANNING)
      parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EligibilityDecisionInput' }
      responses:
        '200': { description: Decision recorded }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /cases/{caseId}/eligibility/override-request:
    post:
      tags: [Eligibility]
      summary: Request governance override of NOT_ELIGIBLE
      parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Override requested (PENDING_ELIGIBILITY, HR Governance) }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /cases/{caseId}/plan/finalize:
    post:
      tags: [Planning]
      summary: Finalize assessment plan (READY_FOR_PLANNING → PLANNING)
      parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizePlanRequest' }
      responses:
        '200': { description: Plan finalized }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /cases/{caseId}/plan:
    get:
      tags: [Planning]
      summary: Get assessment plan with methods and events
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Plan }
        '404': { $ref: '#/components/responses/NotFound' }
  /cases/{caseId}/scorecard:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    get:
      tags: [Scorecard]
      summary: Get competency scorecard configuration and submitted ratings
      responses:
        '200': { description: Scorecard state }
    post:
      tags: [Scorecard]
      summary: Save or submit competency scorecard ratings
      responses:
        '200': { description: Scorecard saved or submitted }
  /cases/{caseId}/scorecard/config:
    patch:
      tags: [Scorecard]
      summary: Update competency scorecard configuration before submission
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Scorecard configuration updated }
  /cases/{caseId}/scorecard/revise:
    post:
      tags: [Scorecard]
      summary: Revise a submitted competency scorecard with justification
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Scorecard revised }
  /cases/{caseId}/events:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    get:
      tags: [Events]
      summary: List assessment events
      responses:
        '200': { description: Events }
    post:
      tags: [Events]
      summary: Schedule assessment event (PLANNING/SCHEDULED → SCHEDULED)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleEventRequest' }
      responses:
        '201': { description: Event scheduled (returns case detail plus eventId) }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /events/{eventId}/evidence:
    post:
      tags: [Evidence]
      summary: Save assessor evidence draft (independent per assessor)
      parameters:
      - in: path
        name: eventId
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceInput' }
      responses:
        '200': { description: Draft saved }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /events/{eventId}/evidence/submit:
    post:
      tags: [Evidence]
      summary: Submit assessor evidence (first submit moves SCHEDULED → IN_PROGRESS)
      parameters:
      - in: path
        name: eventId
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceInput' }
      responses:
        '200': { description: Submitted (returns case detail plus evidenceId) }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /attachments:
    post:
      tags: [Attachments]
      summary: Upload and queue virus scan for a case attachment
      responses:
        '201': { description: Attachment queued for scanning }
  /cases/{caseId}/attachments:
    get:
      tags: [Attachments]
      summary: List attachments linked to an assessment case
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Attachment summaries }
  /attachments/clean/{attachmentId}:
    get:
      tags: [Attachments]
      summary: Stream clean attachment bytes for inline preview or download
      responses:
        '200': { description: Binary file stream }
        '404': { description: File not available }
  /attachments/{attachmentId}:
    get:
      tags: [Attachments]
      summary: Get attachment scan status and metadata
      responses:
        '200': { description: Attachment status }
  /attachments/{attachmentId}/preview:
    get:
      tags: [Attachments]
      summary: Resolve clean attachment preview metadata and stream URL
      responses:
        '200': { description: Preview URL and status }
  /attachments/{attachmentId}/download:
    get:
      tags: [Attachments]
      summary: Resolve clean attachment download metadata and stream URL
      responses:
        '200': { description: Download URL and status }
  /cases/{caseId}/result/finalize:
    post:
      tags: [Results]
      summary: Finalize result (IN_PROGRESS → RESULT_FINALIZED, versioned revision)
      parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizeResultRequest' }
      responses:
        '200': { description: Result finalized }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /cases/{caseId}/result/reopen:
    post:
      tags: [Results]
      summary: Reopen finalized result (RESULT_FINALIZED → IN_PROGRESS)
      parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, expectedVersion]
              properties:
                reason: { type: string, minLength: 10 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: Result reopened }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /cases/{caseId}/result/assessor-recommendation:
    patch:
      tags: [Results]
      summary: Save or refine assessor recommendation notes before finalization
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Assessor recommendation saved }
  /cases/{caseId}/result:
    get:
      tags: [Results]
      summary: Get latest result revision
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Latest result revision }
        '404': { $ref: '#/components/responses/NotFound' }
  /cases/{caseId}/feedback-visibility:
    post:
      tags: [Results]
      summary: Release or withhold candidate feedback visibility
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Feedback visibility updated }
  /cases/{caseId}/recommendation:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    get:
      tags: [Recommendations]
      summary: Get latest recommendation revision
      responses:
        '200': { description: Latest recommendation revision }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Recommendations]
      summary: Submit recommendation (creates HR → Business approval steps, → PENDING_APPROVAL)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitRecommendationRequest' }
      responses:
        '200': { description: Recommendation submitted }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /cases/{caseId}/approval-steps:
    get:
      tags: [Approvals]
      summary: List approval steps in sequence order
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Approval steps }
  /approval-steps/{stepId}/decision:
    post:
      tags: [Approvals]
      summary: Decide one approval step (all APPROVED → APPROVED; REJECTED/CHANGES → back to recommendation)
      parameters:
      - in: path
        name: stepId
        required: true
        schema: { type: string, format: uuid }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionInput' }
      responses:
        '200': { description: Decision recorded }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /cases/{caseId}/development:
    parameters: [{ $ref: '#/components/parameters/CaseId' }]
    get:
      tags: [Development]
      summary: Get development plan with actions
      responses:
        '200': { description: Development plan }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Development]
      summary: Update development plan (APPROVED → DEVELOPMENT_IN_PROGRESS)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDevelopmentRequest' }
      responses:
        '200': { description: Development plan updated }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /cases/{caseId}/reassessment:
    post:
      tags: [Reassessment]
      summary: Schedule reassessment (creates linked DRAFT case; source stays immutable)
      parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, expectedVersion]
              properties:
                reason: { type: string, minLength: 10 }
                targetDate: { type: string, format: date-time }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: Reassessment draft created (returns new case plus linkId) }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /cases/{caseId}/close:
    post:
      tags: [Cases]
      summary: Close case (APPROVED/DEVELOPMENT_IN_PROGRESS → CLOSED)
      parameters:
      - { $ref: '#/components/parameters/CaseId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionCommand' }
      responses:
        '200': { description: Closed }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleFailed' }
  /calibration/matrix:
    get:
      tags: [Calibration]
      summary: Get organization calibration matrix across finalized cases
      responses:
        '200': { description: Calibration matrix payload }
  /cases/{caseId}/copilot/synthesize:
    post:
      tags: [Copilot]
      summary: Synthesize assessment evidence into candidate strengths, gaps, and draft narrative
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Copilot synthesis response }
  /cases/{caseId}/copilot/bias-check:
    post:
      tags: [Copilot]
      summary: Check assessment narrative for biased or ambiguous language
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Copilot bias audit response }
  /cases/{caseId}/copilot/suggest-actions:
    post:
      tags: [Copilot]
      summary: Suggest SMART development plan actions from assessment gaps
      parameters: [{ $ref: '#/components/parameters/CaseId' }]
      responses:
        '200': { description: Suggested SMART development actions }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CaseId:
      in: path
      name: caseId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string }
      description: Command deduplication key, scoped with actor identity. Persisted in PostgreSQL.
  schemas:
    AssessmentReason:
      type: string
      enum: [PROMOTION, INTERNAL_MOBILITY, ROLE_REALIGNMENT]
    ResultCode:
      type: string
      enum: [READY_NOW, READY_WITH_DEVELOPMENT, NOT_READY, INCOMPLETE]
    AssessmentCase:
      type: object
      required: [id, caseCode, assessmentReason, stage, status, scoringEnabled, version, availableActions]
      properties:
        id: { type: string, format: uuid }
        caseCode: { type: string }
        assessmentReason: { $ref: '#/components/schemas/AssessmentReason' }
        stage: { type: string }
        status: { type: string }
        scoringEnabled: { type: boolean, default: true }
        version: { type: integer }
        availableActions:
          type: array
          items:
            type: object
            required: [code, label, kind, enabled]
            properties:
              code: { type: string }
              label: { type: string }
              kind: { type: string, enum: [primary, secondary, danger] }
              enabled: { type: boolean }
              reason: { type: string }
              requiresConfirmation: { type: boolean }
              confirmationSeverity: { type: string, enum: [standard, destructive] }
              prerequisites: { type: array, items: { type: string } }
              consequences: { type: array, items: { type: string } }
              nextOwner: { type: string }
              auditEvent: { type: string }
    CreateCaseRequest:
      type: object
      required: [employeeId, employeeName, department, currentRole, assessmentReason, targetRole, targetLevel, justification]
      properties:
        employeeId: { type: string }
        employeeName: { type: string, minLength: 2, maxLength: 120 }
        department: { type: string }
        currentRole: { type: string }
        assessmentReason: { $ref: '#/components/schemas/AssessmentReason' }
        targetRole: { type: string }
        targetLevel: { type: string }
        justification: { type: string, minLength: 20, maxLength: 4000 }
        priority: { type: string, enum: [LOW, NORMAL, HIGH], default: NORMAL }
    VersionCommand:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    EligibilityDecisionInput:
      type: object
      required: [decision, expectedVersion]
      properties:
        decision: { type: string, enum: [ELIGIBLE, NOT_ELIGIBLE] }
        reason: { type: string }
        expectedVersion: { type: integer, minimum: 1 }
    FinalizePlanRequest:
      type: object
      required: [methods, expectedVersion]
      properties:
        methods:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [methodCode]
            properties:
              methodCode: { type: string }
              methodLabel: { type: string }
              required: { type: boolean, default: true }
              durationMin: { type: integer, minimum: 1, maximum: 1440 }
        leadAssessor: { type: string }
        complexityBand: { type: string }
        deviationReason: { type: string }
        expectedVersion: { type: integer, minimum: 1 }
    ScheduleEventRequest:
      type: object
      required: [startsAt, expectedVersion]
      properties:
        planMethodId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
        location: { type: string }
        meetingLink: { type: string }
        assessors:
          type: array
          maxItems: 20
          items:
            type: object
            required: [userId, displayName]
            properties:
              userId: { type: string }
              displayName: { type: string }
        expectedVersion: { type: integer, minimum: 1 }
    EvidenceInput:
      type: object
      required: [summary]
      properties:
        summary: { type: string, minLength: 20, maxLength: 8000 }
        strengths: { type: string }
        gaps: { type: string }
    FinalizeResultRequest:
      type: object
      required: [resultCode, expectedVersion]
      properties:
        resultCode: { $ref: '#/components/schemas/ResultCode' }
        evidenceSummary: { type: string }
        strengths: { type: string }
        gaps: { type: string }
        developmentFocus: { type: string }
        expectedVersion: { type: integer, minimum: 1 }
    SubmitRecommendationRequest:
      type: object
      required: [code, rationale, expectedVersion]
      properties:
        code: { type: string }
        rationale: { type: string, minLength: 20, maxLength: 8000 }
        requiresDevelopment: { type: boolean, default: false }
        requiresReassessment: { type: boolean, default: false }
        targetDate: { type: string, format: date-time }
        expectedVersion: { type: integer, minimum: 1 }
    ApprovalDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVED, CHANGES_REQUESTED, REJECTED] }
        comment: { type: string }
        expectedVersion: { type: integer, minimum: 1 }
    UpdateDevelopmentRequest:
      type: object
      required: [expectedVersion]
      properties:
        actions:
          type: array
          maxItems: 30
          items:
            type: object
            required: [title, ownerName]
            properties:
              title: { type: string, minLength: 3, maxLength: 200 }
              ownerName: { type: string }
              dueDate: { type: string, format: date-time }
              status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED], default: NOT_STARTED }
              evidenceNote: { type: string }
        targetDate: { type: string, format: date-time }
        expectedVersion: { type: integer, minimum: 1 }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { type: string }
            message: { type: string }
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            blockingRequirements:
              type: array
              items: { type: string }
            correlationId: { type: string }
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Stale version (optimistic concurrency) — refresh and retry
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BusinessRuleFailed:
      description: Validation or workflow rule failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
