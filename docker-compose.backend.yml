services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - ACCESS_ALLOWED_EMAIL_DOMAIN=${ACCESS_ALLOWED_EMAIL_DOMAIN:-saudigerman.com}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://assess.zainx.cloud,https://assessflow.zainx.cloud,https://web-opal-tau-44.vercel.app,https://web-zain-mustafas-projects.vercel.app,http://localhost:3000,http://localhost:5174}
      - DATA_MODE=${DATA_MODE:-database}
      - DEFAULT_LOCALE=en
