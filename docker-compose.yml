services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://assessflow:123456@postgres:5432/asses_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATA_MODE=${DATA_MODE:-database}
      - DEFAULT_LOCALE=en
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: asses_db
      POSTGRES_USER: assessflow
      POSTGRES_PASSWORD: 123456 # DEV-ONLY temporary; rotate before real deploy (docker alt user; real DB uses postgres superuser)
    ports:
      - "5433:5432" # host runs its own PostgreSQL on 5432; avoid conflict
    volumes:
      - asses_db_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessflow -d asses_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - assessflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  asses_db_pg_data:
  assessflow_redis_data:
