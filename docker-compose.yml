services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: assessflow
      POSTGRES_USER: assessflow
      POSTGRES_PASSWORD: assessflow_local_only
    ports:
      - "5432:5432"
    volumes:
      - assessflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessflow -d assessflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - assessflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  assessflow_pg_data:
  assessflow_redis_data:
